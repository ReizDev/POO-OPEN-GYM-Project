<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Plus - Dashboard</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Chart.js para las gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Navbar Minimalista -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">🏋️‍♂️ Fitness Plus</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-light fw-bold" id="nombreUsuario">Usuario</span>
            <button class="btn btn-outline-light btn-sm rounded-circle" onclick="toggleDarkMode()" title="Cambiar tema">🌙</button>
            <button class="btn btn-danger btn-sm px-3" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <!-- Tarjetas de Métricas -->
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card h-100 bg-success text-white text-center p-4 shadow-sm border-0">
                <h5 class="opacity-75 mb-3 fw-bold">SOCIOS ACTIVOS</h5>
                <h2 class="display-4 fw-bold mb-0" id="txtSocios">-</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 bg-info text-white text-center p-4 shadow-sm border-0">
                <h5 class="opacity-75 mb-3 fw-bold">EMPLEADOS</h5>
                <h2 class="display-4 fw-bold mb-0" id="txtEmpleados">-</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 bg-dark text-white text-center p-4 shadow-sm border-0">
                <h5 class="opacity-75 mb-3 fw-bold">USUARIOS TOTALES</h5>
                <h2 class="display-4 fw-bold mb-0" id="txtTotal">-</h2>
            </div>
        </div>
    </div>

    <!-- Botones de Navegación -->
    <div class="row g-3 mb-5">
        <div class="col-md-4">
            <a href="admin-socios.html" class="btn btn-primary btn-lg w-100 py-3 shadow-sm rounded-3 fw-bold">👥 Gestionar Socios</a>
        </div>
        <div class="col-md-4">
            <a href="admin_empleados.html" class="btn btn-secondary btn-lg w-100 py-3 shadow-sm rounded-3 fw-bold">👔 Empleados</a>
        </div>
        <div class="col-md-4">
            <a href="admin_membresias.html" class="btn btn-warning btn-lg w-100 py-3 shadow-sm rounded-3 fw-bold text-dark">⭐ Membresías</a>
        </div>
        <div class="col-md-4">
            <a href="admin_inscripciones.html" class="btn btn-success btn-lg w-100 py-3 shadow-sm rounded-3 fw-bold">📝 Inscripciones</a>
        </div>
        <div class="col-md-4">
            <a href="admin_pagos.html" class="btn btn-info btn-lg w-100 py-3 shadow-sm rounded-3 fw-bold text-dark">💰 Pagos</a>
        </div>
        <div class="col-md-4">
            <a href="admin_reportes.html" class="btn btn-danger btn-lg w-100 py-3 shadow-sm rounded-3 fw-bold">📊 Reportes</a>
        </div>
    </div>

    <!-- Sección de Gráfica y Tabla de Vencimientos -->
    <div class="row g-4">
        <!-- Gráfica -->
        <div class="col-md-5">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h5 class="fw-bold text-secondary mb-0">Distribución de Membresías</h5>
                </div>
                <div class="card-body d-flex align-items-center justify-content-center">
                    <canvas id="graficaMembresias" style="max-height: 300px;"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Tabla Vencimientos -->
        <div class="col-md-7">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-danger text-white fw-bold">
                    ⚠️ Próximos Vencimientos
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="tablaVencimientos">
                            <thead class="table-light">
                                <tr>
                                    <th>Socio</th>
                                    <th>Plan Actual</th>
                                    <th>Vence el</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="3" class="text-center text-muted py-4">Cargando datos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
