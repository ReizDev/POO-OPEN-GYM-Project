<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Plus - Gestión de Membresías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container py-5">
    <!-- Encabezado -->
    <header class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
            <h2 class="fw-bold text-warning text-dark mb-0">⭐ Gestión de Membresías</h2>
            <p class="text-muted mb-0">Administra los planes y costos de tu gimnasio</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary rounded-circle" onclick="toggleDarkMode()" title="Cambiar tema">🌙</button>
            <a href="admin.html" class="btn btn-outline-secondary px-4">Volver al Panel</a>
        </div>
    </header>

    <!-- Controles -->
    <div class="d-flex justify-content-between mb-4">
        <button class="btn btn-warning fw-bold text-dark btn-lg shadow-sm" data-bs-toggle="modal" data-bs-target="#modalMembresia" onclick="abrirModal()">
            ➕ Crear Membresía
        </button>
    </div>

    <!-- Tabla de Datos -->
    <div class="table-container">
        <table class="table table-hover align-middle" id="tablaMembresias">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Plan</th>
                    <th>Costo ($)</th>
                    <th>Duración (Días)</th>
                    <th>Estatus</th>
                    <th class="text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" class="text-center text-muted py-4">Cargando datos...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalMembresia" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content shadow" onsubmit="guardarMembresia(event)">
            <div class="modal-header border-bottom-0">
                <h5 class="modal-title fw-bold" id="modalTitulo">Nueva Membresía</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="membresiaId">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Nombre del Plan</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Ej. Plan Mensual" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Costo</label>
                    <input type="number" step="0.01" id="costo" class="form-control" placeholder="Ej. 400.00" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Duración en Días</label>
                    <input type="number" id="duracion_dias" class="form-control" placeholder="Ej. 30" required>
                </div>
                <div class="mb-3" id="divEstatus" style="display:none;">
                    <label class="form-label text-muted small fw-bold">Estatus</label>
                    <select id="estatus" class="form-select">
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer border-top-0 bg-light rounded-bottom">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-warning fw-bold text-dark px-4">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/membresias.js"></script>
</body>
</html>
