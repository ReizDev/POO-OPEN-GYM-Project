<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Plus - Iniciar Sesión</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="login-container text-center">
    <h1 class="fw-bold text-primary mb-2">🏋️‍♂️ Fitness Plus</h1>
    <p class="text-muted mb-4">Ingresa tus credenciales para continuar</p>

    <div id="loginError" class="alert alert-danger d-none" role="alert">
        Usuario o contraseña incorrectos.
    </div>

    <form id="loginForm">
        <div class="mb-3 text-start">
            <label for="usuario" class="form-label text-muted small fw-bold">Usuario</label>
            <input type="text" class="form-control" id="usuario" placeholder="Ingresa tu usuario" required>
        </div>
        <div class="mb-4 text-start">
            <label for="password" class="form-label text-muted small fw-bold">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Ingresar al Sistema</button>
    </form>
</div>

<!-- OJO AQUÍ: Si guardaste tu archivo login.js dentro de la carpeta "js", usa "js/login.js" -->
<script src="js/login.js"></script>
</body>
</html>
