<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Plus - Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos específicos para impresión */
        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; color: black !important; }
            .card { border: 1px solid #ccc !important; box-shadow: none !important; }
        }
    </style>
</head>
<body>

<div class="container py-5">
    <header class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
            <h2 class="fw-bold text-danger mb-0">📊 Reporte Financiero</h2>
            <p class="text-muted mb-0">Resumen general de ingresos e inscripciones</p>
        </div>
        <div class="d-flex gap-2 no-print">
            <button class="btn btn-outline-secondary rounded-circle" onclick="toggleDarkMode()" title="Cambiar tema">🌙</button>
            <button class="btn btn-secondary px-4" onclick="window.print()">🖨️ Imprimir PDF</button>
            <a href="admin.html" class="btn btn-outline-secondary px-4">Volver al Panel</a>
        </div>
    </header>

    <!-- Tarjetas de Resumen -->
    <div class="row g-4 mb-5">
        <div class="col-md-6">
            <div class="card bg-success text-white h-100 shadow-sm border-0">
                <div class="card-body p-4 text-center">
                    <h5 class="opacity-75 fw-bold mb-3">INGRESOS TOTALES</h5>
                    <h1 class="display-3 fw-bold mb-0" id="totalIngresos">$0.00</h1>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-primary text-white h-100 shadow-sm border-0">
                <div class="card-body p-4 text-center">
                    <h5 class="opacity-75 fw-bold mb-3">MEMBRESÍAS ACTIVAS</h5>
                    <h1 class="display-3 fw-bold mb-0" id="totalInscripciones">0</h1>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <!-- Desglose por Método de Pago -->
        <div class="col-md-4">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-header bg-dark text-white fw-bold">
                    Ingresos por Método
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush" id="listaMetodos">
                        <li class="list-group-item text-center text-muted">Cargando...</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <!-- Últimos Pagos -->
        <div class="col-md-8">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-header bg-dark text-white fw-bold">
                    Últimos 10 Pagos Recibidos
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="tablaRecientes">
                            <thead class="table-light">
                                <tr>
                                    <th>Folio</th>
                                    <th>Socio</th>
                                    <th>Monto</th>
                                    <th>Método</th>
                                    <th>Fecha</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="5" class="text-center text-muted py-3">Cargando datos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="js/main.js"></script>
<script src="js/reportes.js"></script>
</body>
</html>
