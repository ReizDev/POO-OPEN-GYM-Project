<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Plus - Pagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container py-5">
    <header class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
            <h2 class="fw-bold text-success mb-0">💰 Control de Pagos</h2>
            <p class="text-muted mb-0">Registra los ingresos de las inscripciones</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary rounded-circle" onclick="toggleDarkMode()" title="Cambiar tema">🌙</button>
            <a href="admin.html" class="btn btn-outline-secondary px-4">Volver al Panel</a>
        </div>
    </header>

    <div class="d-flex justify-content-between mb-4">
        <button class="btn btn-success fw-bold btn-lg shadow-sm" data-bs-toggle="modal" data-bs-target="#modalPago" onclick="abrirModal()">
            💵 Registrar Pago
        </button>
    </div>

    <div class="table-container">
        <table class="table table-hover align-middle" id="tablaPagos">
            <thead class="table-dark">
                <tr>
                    <th>Folio Pago</th>
                    <th>Socio</th>
                    <th>Membresía Pagada</th>
                    <th>Monto ($)</th>
                    <th>Método</th>
                    <th>Fecha y Hora</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" class="text-center text-muted py-4">Cargando datos...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal para Registrar Pago -->
<div class="modal fade" id="modalPago" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content shadow" onsubmit="guardarPago(event)">
            <div class="modal-header border-bottom-0">
                <h5 class="modal-title fw-bold">Nuevo Pago</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Inscripción a Pagar</label>
                    <select id="selectInscripcion" class="form-select" required>
                        <option value="">Cargando inscripciones...</option>
                    </select>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label text-muted small fw-bold">Monto ($)</label>
                        <input type="number" step="0.01" id="monto" class="form-control" placeholder="Ej. 400.00" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label text-muted small fw-bold">Método de Pago</label>
                        <select id="metodo_pago" class="form-select" required>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Tarjeta">Tarjeta</option>
                            <option value="Transferencia">Transferencia</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-top-0 bg-light rounded-bottom">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-success fw-bold px-4">Procesar Pago</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/pagos.js"></script>
</body>
</html>
